name: Update comet catalog

on:
  workflow_dispatch:
  schedule:
    # 03:37 JST (18:37 UTC on the previous date)
    # Minute 37 avoids the busiest top-of-hour period.
    - cron: "37 18 * * *"

permissions:
  contents: write

concurrency:
  group: hoshinotori-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update basic comet catalog
        run: python scripts/update_catalog.py --page-size 500

      - name: Refresh existing detailed comet files if their orbit changed
        run: python scripts/refresh_existing_details.py --limit 20

      - name: Remove temporary diff file
        run: rm -f data/.last_catalog_diff.json

      - name: Commit only when JSON changed
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "hoshinotori-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data
          git commit -m "Update comet data"
          git push
